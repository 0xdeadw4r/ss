<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invoices - UID Manager</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .invoice-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .invoice-table th,
        .invoice-table td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        .invoice-table th {
            background: var(--surface-alt);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .invoice-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-paid {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--primary-yellow) 0%, var(--yellow-hover) 100%);
            color: var(--text-inverse);
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body>
    <nav>
        <a href="/dashboard" class="nav-brand">
            <img src="/images/logo.webp" alt="UID Manager Logo" class="nav-logo">
            <h1>UID Manager</h1>
        </a>
        <button class="mobile-menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/packages">Packages</a>
            <a href="/admin" id="adminLink" style="display:none;">Admin</a>
            <a href="/buy-credits">Buy Credits</a>
            <a href="/invoices">Invoices</a>
            <a href="/settings">Settings</a>
            <a href="/security">Security</a>
            <button id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>


    <div class="container">
        <div class="header">
            <h2>My Invoices</h2>
        </div>

        <div class="invoice-section">
            <h3>Invoice History</h3>
            <div id="invoicesList">
                <div class="empty-state">Loading invoices...</div>
            </div>
        </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/main.js"></script>
    <script>
        async function loadInvoices() {
            const container = document.getElementById('invoicesList');

            try {
                const response = await fetch('/api/invoices', {
                    credentials: 'include'
                });
                const invoices = await response.json();

                if (invoices.length === 0) {
                    container.innerHTML = '<div class="empty-state">No invoices found</div>';
                    return;
                }

                let tableHTML = `
                    <table class="invoice-table">
                        <thead>
                            <tr>
                                <th>Invoice #</th>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                invoices.forEach(invoice => {
                    const date = new Date(invoice.createdAt).toLocaleDateString('en-IN');
                    const statusClass = invoice.status === 'paid' ? 'status-paid' : 'status-pending';

                    tableHTML += `
                        <tr>
                            <td><strong>${invoice.invoiceNumber}</strong></td>
                            <td>${date}</td>
                            <td>${invoice.type.replace('_', ' ').toUpperCase()}</td>
                            <td>${invoice.currency} ${invoice.total.toFixed(2)}</td>
                            <td><span class="invoice-status ${statusClass}">${invoice.status.toUpperCase()}</span></td>
                            <td>
                                <button class="download-btn" onclick="downloadInvoice('${invoice.invoiceNumber}')">
                                    Download PDF
                                </button>
                            </td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                    </table>
                `;

                container.innerHTML = tableHTML;
            } catch (error) {
                console.error('Load invoices error:', error);
                container.innerHTML = '<div class="empty-state">Failed to load invoices</div>';
            }
        }

        function downloadInvoice(invoiceNumber) {
            window.open(`/api/invoice/${invoiceNumber}/pdf`, '_blank');
        }

        // Load user info for admin check
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await fetchUser();
            if (user && (user.isAdmin || user.isSuperAdmin || user.isOwner || user.isLimitedAdmin)) {
                document.getElementById('adminLink').style.display = 'block';
            }
            loadInvoices();
        });
    </script>
</body>

</html>
